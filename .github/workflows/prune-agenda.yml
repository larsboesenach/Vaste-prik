name: Agenda opschonen

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-opschonen
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove expired agenda items
        run: node .github/scripts/prune-agenda.mjs

      - name: Commit cleanup
        run: |
          if git diff --quiet -- content.json; then
            echo "No expired agenda items found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json
          git commit -m "chore: remove expired agenda items"
          git push