# Pages CMS-configuratie voor Buurtzorgcafé Vaste Prik
# Docs: https://pagescms.org/docs/

media:
  input: assets          # foto's worden in de map assets/ opgeslagen
  output: assets         # en zo in content.json gezet (relatief, dus werkt ook op github.io/Vaste-prik/)
  rename: safe           # bestandsnamen automatisch "schoon" maken
  categories: [image]

content:
  - name: inhoud
    label: Vaste Prik Website - Contend editing tool
    type: file
    path: content.json
    format: json
    fields:

      # ── Bovenaan de pagina ─────────────────────────────
      - name: hero
        label: 👋 Bovenaan de pagina
        type: object
        fields:
          - name: logo
            label: Website logo
            description: "Het logo dat in de header wordt gebruikt."
            type: image
          - name: logo_alt
            label: Beschrijving logo
            type: string
          - name: titel
            label: Grote kop
            type: string
          - name: tekst
            label: Inleidende tekst
            type: text
          - name: foto
            label: Hoofdfoto
            type: image
          - name: foto_alt
            label: Beschrijving hoofdfoto (voor slechtzienden)
            type: string
          - name: lightbox_foto
            label: Lightbox-afbeelding of GIF (optioneel)
            description: "De afbeelding die bezoekers na een klik groot zien. Laat leeg om de hoofdfoto te gebruiken."
            type: image
          - name: bordje
            label: Foto van het bordje
            type: image
          - name: bordje_alt
            label: Beschrijving bordje
            type: string

      # ── Wat is het ─────────────────────────────────────
      - name: wat
        label: 🏡 Wat is Vaste Prik?
        type: object
        fields:
          - name: titel
            label: Kop
            type: string
          - name: alineas
            label: Alinea's
            type: text
            list: true
          - name: quote
            label: Citaat (zonder aanhalingstekens)
            type: text
          - name: foto1
            label: Foto links
            type: image
          - name: foto1_alt
            label: Beschrijving foto links
            type: string
          - name: foto2
            label: Foto rechts
            type: image
          - name: foto2_alt
            label: Beschrijving foto rechts
            type: string

      # ── Ons recept ─────────────────────────────────────
      - name: recept
        label: 🌱 Ons recept (schijf van vijf)
        type: object
        fields:
          - name: intro
            label: Inleiding
            type: text
          - name: kaarten
            label: Kaarten
            description: "De nummering (01, 02, ...) volgt automatisch de volgorde."
            type: object
            list: true
            fields:
              - name: icoon
                label: Emoji
                type: string
              - name: titel
                label: Titel
                type: string
              - name: tekst
                label: Tekst
                type: text

      # ── Lopende tekst-balk ─────────────────────────────
      - name: marquee
        label: 💬 Voorbijschuivende woorden (balk)
        type: string
        list: true

      # ── Agenda ─────────────────────────────────────────
      - name: agenda
        label: "🗓️ Agenda · plan vooruit; website toont 2 maanden"
        description: "Plan losse activiteiten en bijeenkomsten gerust ver vooruit: op de website zie je alleen de huidige en volgende maand, zodat de kalender compact blijft. Alleen Koffie & Inloop wordt automatisch elke dinsdag en vrijdag van 11:00 tot 15:00 ingepland. Beweegspreekuur, Gezonde Ontmoeting, Diabetes spreekuur en overige activiteiten verschijnen alleen op de datums die je zelf opgeeft."
        type: object
        fields:
          - name: intro
            label: Inleiding
            type: text
          - name: notitie
            label: Tekst onder de kalender
            type: text
          - name: losse_activiteiten
            label:  🌕 Losse activiteiten (verschijnen als gele stip in de kalender)
            type: object
            list: true
            fields:
              - name: datum
                label: Datum
                type: date
                default: ""
                options:
                  format: yyyy-MM-dd
              - name: titel
                label: Titel (bijv. Grote pan couscous)
                type: string
              - name: tijd
                label: Tijdstip (optioneel, bijv. 14:00–16:00 of 18:30)
                type: string
                default: ""
              - name: van
                label: Van (optioneel, bijv. 14:00)
                type: string
                default: "" 
              - name: tot
                label: Tot (optioneel, bijv. 16:00)
                type: string
                default: ""
              - name: afgelast
                label: Afgelast
                description: "Vink aan als deze activiteit niet doorgaat; de kalender toont dit bij de datum."
                type: boolean
                default: false
          - name: beweegspreekuur
            label: 🏃 Beweegspreekuur (afzonderlijke datums)
            description: "Voeg alleen de maandagen toe waarop het spreekuur daadwerkelijk plaatsvindt. Je hoeft tussenliggende maandagen niet af te gelasten. Oude afspraken worden zeven dagen na de datum automatisch verwijderd."
            type: object
            fields:
              - name: afspraken
                label: Spreekuurdatums
                type: object
                list:
                  collapsible:
                    summary: "Spreekuur {datum}"
                fields:
                  - name: datum
                    label: Datum
                    type: date
                    default: ""
                    options:
                      format: yyyy-MM-dd
                  - name: tijd
                    label: Tijd (optioneel, anders de standaardtijd)
                    type: string
                    default: ""
                  - name: afgelast
                    label: Afgelast
                    description: "Vink dit alleen aan als het spreekuur op deze datum niet doorgaat."
                    type: boolean
                    default: false
          - name: afwijkingen
            label: 🔁 Eenmalige wijzigingen vaste activiteiten
            description: "Gebruik dit alleen voor Koffie & Inloop, dat automatisch elke dinsdag en vrijdag van 11:00 tot 15:00 wordt ingepland. Voeg één regel toe met de datum waarop de inloop niet doorgaat en vink Afgelast aan. Gebruik Nieuwe datum alleen als de inloop wordt verplaatst."
            type: object
            list: true
            fields:
              - name: datum
                label: Oorspronkelijke datum
                type: date
                default: ""
                options:
                  format: yyyy-MM-dd
              - name: activiteit
                label: Vaste activiteit
                description: "Kies de vaste activiteit waarop deze wijziging van toepassing is."
                type: select
                options:
                  values:
                    - "Koffie & Inloop"
              - name: afgelast
                label: Afgelast
                description: "Vink aan als de activiteit op de oorspronkelijke datum niet doorgaat. Laat uit voor een tijdswijziging of verplaatsing."
                type: boolean
                default: false
              - name: nieuwe_datum
                label: Nieuwe datum (alleen bij verplaatsen)
                type: date
                default: ""
                options:
                  format: yyyy-MM-dd
              - name: tijd
                label: Nieuwe tijd (optioneel)
                description: "Vul alleen in als de tijd op deze datum afwijkt, bijvoorbeeld 14:00–16:00."
                type: string
                default: ""
          - name: gezonde_ontmoeting
            label:  🌿 Gezonde Ontmoeting (afzonderlijke bijeenkomsten)
            description: "Voeg voor iedere bijeenkomst één item toe met de datum waarop deze plaatsvindt. Je kunt zo veel bijeenkomsten per maand plannen als nodig; een aparte maandkeuze is niet nodig. Vul optioneel een onderwerp in; als je dit leeg laat, verschijnt de Legenda-naam. Oude bijeenkomsten worden zeven dagen na de datum automatisch verwijderd."
            type: object
            fields:
              - name: label
                label: Volledige naam (legenda)
                type: string
                default: "🌿 Gezonde Ontmoeting"
              - name: van
                label: Starttijd (standaard 14:00)
                type: string
                default: "14:00"
              - name: tot
                label: Eindtijd (standaard 16:00)
                type: string
                default: "16:00"
              - name: afspraken
                label: Bijeenkomsten
                type: object
                list:
                  collapsible:
                    summary: "Bijeenkomst {datum}"
                fields:
                  - name: datum
                    label: Datum
                    type: date
                    default: ""
                    options:
                      format: yyyy-MM-dd
                  - name: onderwerp
                    label: Onderwerp (optioneel; zichtbaar in agenda)
                    description: "Laat leeg om de Legenda-naam te tonen."
                    type: string
                    default: ""
                  - name: van
                    label: Starttijd (optioneel)
                    type: string
                    default: ""
                  - name: tot
                    label: Eindtijd (optioneel)
                    type: string
                    default: ""
                  - name: afgelast
                    label: Afgelast
                    description: "Vink aan als deze bijeenkomst niet doorgaat."
                    type: boolean
                    default: false
          - name: diabetes_spreekuur
            label: 🩺 Diabetes spreekuur (afzonderlijke afspraken)
            description: "Voeg voor elk spreekuur één item toe met de datum waarop het plaatsvindt. Je kunt zelf bepalen hoeveel spreekuren er per maand zijn; een aparte maandkeuze is niet nodig. Oude afspraken worden zeven dagen na de datum automatisch verwijderd."
            type: object
            fields:
              - name: kort
                label: Korte naam (kalender)
                type: string
                default: "Diabetes spreekuur"
              - name: label
                label: Volledige naam (legenda)
                type: string
                default: "🥣 Diabetes spreekuur"
              - name: van
                label: Starttijd (standaard 13:30)
                type: string
                default: "13:30"
              - name: tot
                label: Eindtijd (standaard 15:00)
                type: string
                default: "15:00"
              - name: afspraken
                label: Afspraken
                type: object
                list:
                  collapsible:
                    summary: "Afspraak {datum}"
                fields:
                  - name: datum
                    label: Datum
                    type: date
                    default: ""
                    options:
                      format: yyyy-MM-dd
                  - name: onderwerp
                    label: Onderwerp (optioneel; zichtbaar in agenda)
                    description: "Laat leeg om de Legenda-naam te tonen."
                    type: string
                    default: ""
                  - name: van
                    label: Starttijd (optioneel)
                    type: string
                    default: ""
                  - name: tot
                    label: Eindtijd (optioneel)
                    type: string
                    default: ""
                  - name: afgelast
                    label: Afgelast
                    description: "Vink aan als dit spreekuur niet doorgaat."
                    type: boolean
                    default: false
          - name: activiteiten
            label: Terugkerende activiteit en losse activiteitennamen
            description: "Alleen Koffie & Inloop verschijnt automatisch op dinsdag en vrijdag van 11:00 tot 15:00. De andere activiteiten voeg je zelf toe bij Losse activiteiten."
            type: object
            fields:
              - name: koffie
                label: ☕ Koffie & Inloop
                description: "Wordt elke dinsdag en vrijdag van 11:00 tot 15:00 herhaald. Een geplande dag kun je afzeggen via Eenmalige wijzigingen vaste activiteiten."
                type: object
                fields:
                  - { name: kort, label: Korte naam (in kalender), type: string }
                  - { name: label, label: Volledige naam (legenda), type: string, default: "☕ Koffie & Inloop" }
                  - { name: tijd, label: Tijd, type: string }
              - name: beweeg
                label: 🏃 Beweegspreekuur
                description: "De datums worden afzonderlijk ingesteld bij Beweegspreekuur."
                type: object
                fields:
                  - { name: kort, label: Korte naam (in kalender), type: string }
                  - { name: label, label: Volledige naam (legenda), type: string, default: "💪 Beweegspreekuur (met studenten)" }
                  - { name: tijd, label: Tijd, type: string }
      # ── Veelgestelde vragen ────────────────────────────
      - name: faq
        label: ❓ Veelgestelde vragen
        type: object
        list: true
        fields:
          - name: vraag
            label: Vraag
            type: string
          - name: antwoord
            label: Antwoord
            description: "Je kunt {dagen}, {van} en {tot} gebruiken; deze worden automatisch ingevuld."
            type: text

      # ── Verhalen ───────────────────────────────────────
      - name: verhalen
        label: 💬 Verhalen (reacties van bezoekers)
        type: object
        list: true
        fields:
          - name: quote
            label: Citaat (zonder aanhalingstekens)
            type: text
          - name: naam
            label: Naam en rol (bijv. Corry · bezoekster)
            type: string

      # ── Contact ────────────────────────────────────────
      - name: contact
        label: 📍 Contact
        type: object
        fields:
          - name: tekst
            label: Inleidende tekst
            type: text
          - name: email
            label: E-mailadres
            type: string
          - name: telefoon
            label: Telefoonnummer
            type: string
          - name: adres_kort
            label: Adres (kort, bovenaan de pagina)
            type: string
          - name: adres
            label: Adres (volledig, zoals getoond)
            type: string
          - name: adres_zoek
            label: Adres voor de kaart (straat + plaats)
            description: "Wordt gebruikt voor de Google Maps-kaart en de routelink."
            type: string
          - name: doemee_titel
            label: "Doe mee: kop"
            type: string
          - name: doemee_tekst
            label: "Doe mee: tekst"
            type: text
          - name: radio_titel
            label: "Radio Steunkous: kop"
            type: string
          - name: radio_tekst
            label: "Radio Steunkous: tekst"
            type: text
          - name: radio_knop
            label: "Radio Steunkous: knoptekst"
            type: string
          - name: persoon
            label: Initiatiefnemer
            type: object
            fields:
              - { name: foto, label: Foto, type: image }
              - { name: foto_alt, label: Beschrijving foto, type: string }
              - { name: rol, label: Rol, type: string }
              - { name: naam, label: Naam, type: string }
              - { name: functie, label: Functie, type: string }
              - { name: quote, label: Citaat (zonder aanhalingstekens), type: text }
              - { name: extra, label: Extra tekst, type: text }

      # ── Footer ─────────────────────────────────────────
      - name: footer
        label: 🔗 Onderaan de pagina
        type: object
        fields:
          - name: beschrijving
            label: Beschrijving
            type: text
